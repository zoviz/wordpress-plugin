name: WordPress.org Assets

# Manual dispatch only — pushing/merging to main never syncs anything to
# wp.org. Syncs banner/icon/screenshots (and readme.txt) to the wp.org SVN
# `assets` directory on demand. This is independent of a release — plugin
# listing assets can update without shipping a new plugin version — but it
# still requires a human to decide *when*, same as release.yml.
on:
  workflow_dispatch: {}

concurrency:
  group: assets-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  assets:
    name: Update WordPress.org assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Plugin Assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
