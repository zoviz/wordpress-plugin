name: WordPress.org Assets

# Syncs banner/icon/screenshots (and readme.txt) to the wp.org SVN `assets`
# directory whenever they change on main. This is independent of a release
# — plugin listing assets can update without shipping a new plugin version.
on:
  push:
    branches: [main]
    paths:
      - '.wordpress-org/**'
      - 'readme.txt'

concurrency:
  group: assets-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  assets:
    name: Update WordPress.org assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Plugin Assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
