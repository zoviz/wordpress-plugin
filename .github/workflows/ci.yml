name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-lint:
    name: PHP lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - uses: ramsey/composer-install@v3
      - name: PHPCS (WordPress-Extra + WordPress-Docs + PHPCompatibilityWP)
        run: composer lint
      - name: PHPStan (level 6)
        run: composer analyse

  php-unit:
    name: PHP unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - uses: ramsey/composer-install@v3
      - run: composer test:unit

  php-integration:
    name: PHP integration (WP ${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.4'
            php: '7.4'
          - wp: 'latest'
            php: '8.3'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - uses: ramsey/composer-install@v3
      - name: Pin wp-phpunit to the WordPress version under test
        if: matrix.wp != 'latest'
        run: |
          composer require --dev --no-interaction --with-all-dependencies \
            "wp-phpunit/wp-phpunit:~${{ matrix.wp }}.0" \
            "yoast/phpunit-polyfills:^1.1"
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Pin wp-env core to the WordPress version under test
        if: matrix.wp != 'latest'
        run: |
          echo '{ "core": "WordPress/WordPress#${{ matrix.wp }}", "phpVersion": "${{ matrix.php }}" }' > .wp-env.override.json
      - run: npx wp-env start
      - run: npm run test:php:integration

  js:
    name: JS lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run test:js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 3

  i18n:
    name: POT freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the POT file
        # wp-cli's `i18n make-pot` runs on the `before_wp_load` hook, so the
        # official wp-cli image can do this without a database or a full
        # WordPress install.
        run: |
          # `wp i18n make-pot` stamps the Report-Msgid-Bugs-To header from
          # the *basename of the mounted source directory*, not from
          # --domain or the plugin's Text Domain header — so the container
          # path must be named after the plugin slug, not a generic /app.
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}":/app/zoviz-ai-studio -w /app/zoviz-ai-studio wordpress:cli \
            wp i18n make-pot . languages/zoviz-ai-studio.pot.fresh \
              --domain=zoviz-ai-studio \
              --exclude=node_modules,vendor,tests,build,docs \
              --allow-root
      - name: Compare against the committed POT (ignoring the creation timestamp)
        run: |
          if ! diff \
            <(grep -v '^"POT-Creation-Date:' languages/zoviz-ai-studio.pot) \
            <(grep -v '^"POT-Creation-Date:' languages/zoviz-ai-studio.pot.fresh); then
            echo "::error::languages/zoviz-ai-studio.pot is out of date — see docs/i18n.md for how to regenerate it, then commit the result." >&2
            exit 1
          fi

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - uses: ramsey/composer-install@v3
        with:
          composer-options: '--no-dev --classmap-authoritative'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      # NOTE: pin/verify this action's current inputs against
      # https://github.com/WordPress/plugin-check-action on first use — the
      # action's API has changed across major versions.
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: '.'
          # The checkout lands in a directory named after the GitHub repo
          # (wordpress-plugin), not the plugin slug, so the action's
          # auto-detected slug mismatches our Text Domain header. Pin it
          # explicitly to the real slug.
          slug: 'zoviz-ai-studio'

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
